snapshot:
  name: LinkedIn workflows
  version: 2
  as_of: 2026-10-23
  status: configuration snapshot; not an executable source-code package
  note: >-
    This version preserves the earlier snapshot and records the current live
    settings for the four LinkedIn routines. The daily publisher now uses the
    direct LinkedIn REST API rather than the interactive post form. That route
    has not yet been live-tested because doing so would create a public post.
routines:
  - id: 6ad9735a0ae39154de1432b7
    name: LinkedIn remote job matches
    enabled: true
    timezone: Asia/Jakarta
    schedule:
      kind: dailyMultiTime
      hours: [5, 9, 13, 17, 22]
      minute: 0
    instructions: |
      Search recent LinkedIn job listings for remote worldwide opportunities that fit the user's background in procurement, executive assistance, personal assistance, virtual assistance, and administrative support. Read /agent/user/Routines/linkedin-remote-jobs/learnings.md and /agent/user/Routines/linkedin-remote-jobs/seen_urls.txt first. Include only listings that appear active and are explicitly open worldwide or to applicants in Indonesia/Asia; exclude postings restricted to other countries. Do not assume that a listing is worldwide just because the employer operates globally. Do not claim eligibility, posting dates, or requirements that the source does not confirm. For each new eligible listing, include the role, employer, location/eligibility, posting date if shown, a brief fit note, and the direct LinkedIn URL. Do not repeat any URL already in seen_urls.txt, and do not contact employers or apply. If there are new verified matches, email the user at italiani1119@gmail.com with the findings and then append the included URLs to seen_urls.txt. If there are no new verified matches, send nothing. Add any correction the user gives you to learnings.md.

      For the alert email, use Resend and send from Ita Liani <reminder@r2studio.my.id> to italiani1119@gmail.com.

      Only include listings whose posting age is verifiably between 24 hours and 7 days at the time of the run. Exclude listings newer than 24 hours, older than 7 days, or without a verifiable posting age.
  - id: 6ad96be3d837bde634e51fc2
    name: LinkedIn comment reply drafts
    enabled: true
    timezone: Asia/Jakarta
    schedule:
      kind: dailyMultiTime
      hours: [8, 10, 12, 14, 16, 18]
      weekdays: [mon, tue, wed, thu, fri]
      minute: 0
    instructions: |
      Check the user's LinkedIn posts for new comments and draft replies. Read /agent/user/Routines/linkedin-daily-posts/post_urns.txt — each line is a post URN of a post the user published (the Daily LinkedIn post routine appends the URN of each post it publishes). For each post URN, fetch its comments with the LinkedIn retrieve-comments-shares action. For each comment that is not already listed in /agent/user/Routines/linkedin-daily-posts/replied_comments.txt, write a reply draft in English in a natural human voice (never robotic or AI-sounding — short, warm, conversational, like a real person answering on LinkedIn; thank them, engage with what they said, and keep it under 3 sentences; never use hashtags or emoji spam). Save each draft to /agent/user/Routines/linkedin-daily-posts/reply_drafts/<post-urn>/<comment-id>.md with the commenter's name and the draft text. Then email the user at italiani1119@gmail.com with subject 'LinkedIn comment replies — drafts ready' listing each new comment (who commented, what they said, and the draft reply), noting the drafts are saved and she can reply to approve, edit, or reject them. Do not post any reply to LinkedIn — drafts only. After emailing, append each handled comment id to /agent/user/Routines/linkedin-daily-posts/replied_comments.txt so it is not drafted again. If there are no new comments, send nothing and end quietly.
  - id: 6ad96931eb9db68c86c18bd9
    name: LinkedIn post drafts
    enabled: true
    timezone: Asia/Jakarta
    schedule:
      kind: daily
      hour: 8
      minute: 0
    instructions: |
      Every day at 8:00 AM, draft the LinkedIn post for the user's personal profile (Ita Liani), intended for possible publication at 10:00 AM only if the user explicitly approves it by replying to that day's preview email before 10:00. Read /agent/user/Routines/linkedin-daily-posts/learnings.md and /agent/user/Routines/linkedin-daily-posts/last_topic.txt (if it exists) first. Pick a topic different from the one in last_topic.txt, rotating among: procurement (sourcing, vendor management, cost savings, RFQ/RFP, purchase orders, supplier negotiation), executive assistant (calendar management, inbox zero, meeting prep, travel coordination, stakeholder communication, executive support), or personal assistant (task management, prioritization, remote work productivity, time blocking). Write the post in English, in a natural human-editor voice (never robotic or AI-sounding): 150-250 words, open with a hook, include one short personal insight or practical tip, end with a light question, and include 3-5 relevant hashtags (e.g. #Procurement #ExecutiveAssistant #RemoteWork #PersonalAssistant #VirtualAssistant #AdminLife). The purpose of these posts is personal branding: the user has not yet landed her first remote job, so every post should position her as a strong, hireable remote-work candidate in procurement, executive assistance, or personal assistance — showcasing her skills, reliability and value so recruiters and hiring managers want to reach out. Save the topic name to /agent/user/Routines/linkedin-daily-posts/last_topic.txt and the exact post text to /agent/user/Routines/linkedin-daily-posts/pending.md (overwrite any previous content). Then email the user at italiani1119@gmail.com the full draft with subject 'LinkedIn post preview — posting today at 10:00'. State clearly that the post will go live at 10:00 only if the user replies to that same email with explicit approval before 10:00; otherwise it will not be posted. Give examples such as 'setuju, publikasikan' or 'ok eksekusi postnya', and say that replies such as 'looks good', edit requests, questions, or no reply do not authorize publication.
  - id: 6ad967f22e49feeef81fc557
    name: Daily LinkedIn post
    enabled: true
    timezone: Asia/Jakarta
    schedule:
      kind: daily
      hour: 10
      minute: 0
    instructions: |
      Post a LinkedIn post publicly on the user's personal profile only after the user explicitly approves that day's draft by email. First read /agent/user/Routines/linkedin-daily-posts/pending.md and /agent/user/Routines/linkedin-daily-posts/learnings.md. Find and read the preview email for the current date in the user's Gmail account (subject: 'LinkedIn post preview — posting today at 10:00', sent to italiani1119@gmail.com), including the latest reply in that same thread. Publish only if the latest reply is from the user and clearly authorizes publishing this exact draft (for example, 'approve', 'approved', 'yes, publish it', 'setuju', 'ya, publikasikan', or 'ok eksekusi postnya'), with no requested edits or unanswered questions. A reply that only says 'looks good', an ambiguous response, an edit request, a question, no reply, or a reply received on a different date is not approval: do not post and stop quietly. Do not generate a replacement post in this routine; if today's pending draft or preview email is missing, do not post. Confirm that pending.md matches the draft in today's preview email. Then publish that exact text publicly through LinkedIn's direct REST API, not the interactive post form, using the connected member's current person URN as author, the exact draft as commentary, PUBLIC visibility, MAIN_FEED distribution, and PUBLISHED lifecycle state. If the API requests an additional manual confirmation or returns an error, do not try a second publishing route and do not claim it was posted; notify the user that publishing failed and state the exact blocker. After a successful post, capture the returned post URN from the response header without guessing, append it to /agent/user/Routines/linkedin-daily-posts/post_urns.txt (one per line), save the published topic in /agent/user/Routines/linkedin-daily-posts/last_topic.txt so the next draft rotates, send the user a one-line summary containing the topic and first few words, and delete pending.md. Never publish without same-day explicit email approval.